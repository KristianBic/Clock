<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/x-icon" href="../icons/favicon.svg">
    <title id="Title">DigitalClock</title>
</head>
<body>
    <a href="stopwatch.html">StopWatch</a> 
    <div id="displayTimeInDays" class="clock" onload="showTime()">TIME</div>
    <div id="displayTimeInYear" class="date">DATE</div>
    <div class="foreignTimeGroup">
        <div class="foreignTimeContainer">
            <h6>Los Angeles</h6>
            <div id="losAngelesTime" class="foreignTime">TIME</div>
        </div>
        <div class="foreignTimeContainer">
            <h6>New York</h6>
            <div id="newYorkTime" class="foreignTime">TIME</div>
        </div>
        <div class="foreignTimeContainer">
            <h6>London</h6>
            <div id="londonTime" class="foreignTime">TIME</div>
        </div>
        <div class="foreignTimeContainer">
            <h6>Pariz</h6>
            <div id="parizTime" class="foreignTime">TIME</div>
        </div>
        <div class="foreignTimeContainer">
            <h6>Kyjev</h6>
            <div id="kyjevTime" class="foreignTime">TIME</div>
        </div>
        <div class="foreignTimeContainer">
            <h6>Peking</h6>
            <div id="pekingTime" class="foreignTime">TIME</div>
        </div>
        <div class="foreignTimeContainer">
            <h6>Tokio</h6>
            <div id="tokioTime" class="foreignTime">TIME</div>
        </div>
    </div>    

    <script src="../js/script.js"></script>
</body>
</html>
